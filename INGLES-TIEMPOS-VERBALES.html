/* ===== UTILIDADES ===== */
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const N=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/won't/g,"will not").replace(/'ll/g," will").replace(/n't/g," not").replace(/'m/g," am").replace(/'re/g," are").replace(/[.,?!¿¡]/g,"").replace(/\s+/g," ").trim();
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let ok=0,tot=0;
const score=r=>{tot++;if(r)ok++;document.getElementById("sc").textContent="⭐ "+ok+" / "+tot};
const say=(t,r)=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;speechSynthesis.speak(u)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)say(b.dataset.say,+b.dataset.r)});

const tb=h("button","","👩‍🏫 Respuestas");tb.onclick=()=>document.body.classList.toggle("t");nav.appendChild(tb);

function mcBlock(list,box){
 list.forEach((x,i)=>{const p=x.split("|"),good=p[1],q=h("div","q");
  q.appendChild(h("p","",(i+1)+". "+p[0]));let done=false;
  sh(p.slice(1)).forEach(o=>{const b=h("button","o",o);b.onclick=()=>{if(done)return;done=true;
   q.querySelectorAll(".o").forEach(z=>{if(z.textContent===good)z.classList.add("good")});
   if(o!==good)b.classList.add("bad");score(o===good)};q.appendChild(b)});
  q.appendChild(h("div","key","✔ "+good));box.appendChild(q)})}

function fillBlock(list,box){
 list.forEach((x,i)=>{const [txt,ans]=x.split("|"),q=h("div","q"),pp=txt.split("___"),hint=pp[1].match(/\(.*\)\s*$/);
  const p=h("p");p.appendChild(document.createTextNode((i+1)+". "+pp[0]));
  const inp=h("input");inp.placeholder="escribe aquí";inp.autocomplete="off";inp.spellcheck=false;p.appendChild(inp);
  p.appendChild(document.createTextNode(pp[1].replace(/\(.*\)\s*$/,"")));
  if(hint)p.appendChild(h("span","hint"," "+hint[0]));
  const b=h("button","btn","Revisar"),fb=h("span","fb");let done=false;
  const chk=()=>{if(done||!inp.value.trim())return;done=true;const r=ans.split("/").some(a=>N(a)===N(inp.value));
   q.classList.add(r?"good":"bad");fb.textContent=r?"✅ ¡Correcto!":"❌ Respuesta: "+ans;score(r)};
  b.onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter")chk()};
  q.append(p,b,fb,h("div","key","✔ "+ans));box.appendChild(q)})}

function buildBlock(list,box){
 list.forEach((x,i)=>{const [es,en]=x.split("|"),q=h("div","q");
  q.appendChild(h("p","",(i+1)+". Arma la oración: "+es));
